[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-scan"
version = "0.1.0"
description = "Security and conformance scanner for MCP servers and SKILL.md agent skills: tool poisoning, rug pulls, dangerous sinks, hardcoded secrets - with measured per-rule false-positive rates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ranadhir Ghosh" }]
keywords = ["mcp", "model-context-protocol", "agent-skills", "security", "scanner", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
sentinel-scan = "sentinel_scan.cli:main"

[project.urls]
Homepage = "https://github.com/ranadhir19/sentinel-scan"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel_scan = ["demo.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
